name: samlab-admission-isolated
services:
  postgres:
    image: sub2api-postgres-pgvector:18.4-0.8.6-alpine3.24
    environment:
      POSTGRES_USER: labtest
      POSTGRES_DB: labtest
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?test secret required}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres:/var/lib/postgresql
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labtest -d labtest"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?test secret required}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56380:6379"
    volumes:
      - redis:/data
    mem_limit: 128m
    cpus: 0.25
  main:
    image: samlab-admission:candidate-20261111
    network_mode: host
    env_file: runtime.env
    environment:
      AUTO_SETUP: "true"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "55433"
      DATABASE_USER: labtest
      DATABASE_DBNAME: labtest
      DATABASE_SSLMODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "56380"
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: "18080"
      GOMAXPROCS: "2"
    volumes:
      - main:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 1g
    cpus: 1
  worker:
    image: samlab-admission:candidate-20261111
    network_mode: host
    entrypoint: ["/app/lab-admission-worker"]
    env_file: runtime.env
    environment:
      GOMAXPROCS: "1"
    depends_on:
      main:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      disable: true
volumes:
  postgres:
  redis:
  main:
