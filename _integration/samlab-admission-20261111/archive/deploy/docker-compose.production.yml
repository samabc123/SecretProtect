services:
  conversation-archive:
    image: sub2api-conversation-archive:7
    container_name: sub2api-conversation-archive
    restart: unless-stopped
    ports:
      - "${ARCHIVE_BIND_HOST:?set ARCHIVE_BIND_HOST}:8081:8081"
    environment:
      LISTEN_ADDR: ":8081"
      UPSTREAM_URL: "http://sub2api:8080"
      PRIVACY_FILTER_URL: "http://privacy-filter:8088"
      PRIVACY_FILTER_TIMEOUT: "10s"
      PRIVACY_MAX_BODY_BYTES: "268435456"
      DATABASE_URL: "${ARCHIVE_DATABASE_URL:?set ARCHIVE_DATABASE_URL}"
      TRAJECTORY_UPLOAD_DATABASE_URL: "${TRAJECTORY_IMPORT_DATABASE_URL:?set TRAJECTORY_IMPORT_DATABASE_URL}"
      ARCHIVE_PUBLIC_URL: "${ARCHIVE_PUBLIC_URL:?set ARCHIVE_PUBLIC_URL}"
      DATABASE_TIMEOUT: "5s"
      IDENTITY_RESOLVE_TIMEOUT: "30s"
      IDENTITY_RESOLVE_INTERVAL: "1s"
      IDENTITY_RESOLVE_BATCH_SIZE: "100"
      ADMIN_AUTH_TIMEOUT: "5s"
      UPLOAD_DEVICE_TTL: "10m"
      UPLOAD_SESSION_TTL: "2h"
      UPLOAD_POLL_INTERVAL: "3s"
      UPLOAD_MAX_BYTES: "2147483648"
      UPLOAD_MAX_RECORD_BYTES: "16777216"
      RETENTION_DAYS: "30"
      RETENTION_SWEEP_ENABLED: "false"
      SWEEP_INTERVAL: "1h"
      SWEEP_BATCH_SIZE: "5000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - sub2api-network
    healthcheck:
      test: ["CMD", "/archive-proxy", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sub2api-network:
    external: true
    name: sub2api_sub2api-network
