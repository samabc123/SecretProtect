<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>对话与 Agent 轨迹归档</title>
  <style>
    :root{color-scheme:light;--bg:#f3f7fb;--panel:#fff;--text:#172033;--muted:#667085;--line:#e2e8f0;--primary:#2563eb;--primary-soft:#eff6ff;--danger:#b42318;--success:#067647;--warning:#b54708;--shadow:0 12px 32px rgba(30,64,175,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select{font:inherit}.shell{max-width:1560px;margin:0 auto;padding:24px}.header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.header h1{font-size:24px;margin:0}.header p{margin:4px 0 0;color:var(--muted)}
    .session{color:var(--muted)}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}.tab{border:0;background:transparent;padding:10px 16px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--primary);border-color:var(--primary);font-weight:650}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.filters{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:12px;padding:18px;margin-bottom:18px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fff;outline:none;transition:.2s}.field input:focus,.field select:focus{border-color:#93b4ff;box-shadow:0 0 0 3px rgba(37,99,235,.1)}.actions{display:flex;align-items:end;gap:8px}.btn{height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 14px;cursor:pointer;transition:.2s}.btn:hover{border-color:#9db8f5;color:var(--primary)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:#1d4ed8}.btn:disabled{opacity:.45;cursor:not-allowed}
    .table-head,.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}.table-head{border-bottom:1px solid var(--line)}.status{color:var(--muted)}.status.error{color:var(--danger)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1120px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted);background:#fafafa}tbody tr{cursor:pointer}tbody tr:hover{background:#f8faff}.empty{text-align:center;color:var(--muted);padding:48px}.pagination{border-top:1px solid var(--line);justify-content:flex-end;gap:8px}.pagination span{margin-right:auto;color:var(--muted)}
    .pill{display:inline-flex;border-radius:999px;padding:2px 8px;font-size:12px;background:#eef2ff;color:#3448a6}.pill.completed{background:#ecfdf3;color:var(--success)}.pill.failed,.pill.aborted{background:#fef3f2;color:var(--danger)}.pill.incomplete{background:#fff6ed;color:var(--warning)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;justify-content:flex-end;z-index:20}.overlay.open{display:flex}.drawer{width:min(900px,94vw);height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-20px 0 45px rgba(15,23,42,.18)}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.close{border:0;background:transparent;font-size:24px;cursor:pointer}.drawer-body{overflow:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.kv{border:1px solid var(--line);border-radius:6px;padding:10px}.kv span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.section{margin-top:18px}.section h3{font-size:14px;margin:0 0 8px}.pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:12px;max-height:520px;overflow:auto}
    .timeline{position:relative;margin-top:16px}.event{border-left:3px solid #cbd5e1;padding:0 0 18px 16px;margin-left:5px}.event.assistant_message{border-color:#2457d6}.event.user_message{border-color:#067647}.event.tool_call,.event.tool_result,.event.command_execution,.event.file_change{border-color:#b54708}.event-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.event-title{font-weight:650}.event-meta{color:var(--muted);font-size:12px}.event details summary{cursor:pointer;color:var(--primary)}
    .message-list{display:grid;gap:10px}.message-card{border:1px solid var(--line);border-radius:6px;background:#fff;padding:12px}.message-card.user{border-left:3px solid var(--success)}.message-card.developer,.message-card.system{border-left:3px solid var(--warning)}.message-card.assistant{border-left:3px solid var(--primary)}.message-role{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:6px}.message-card .pre{max-height:360px}
    .insights{position:relative;overflow:hidden;margin-bottom:18px;padding:20px;background:linear-gradient(135deg,#fff 0%,#f8fbff 52%,#f0f7ff 100%)}.insights:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-100px;top:-140px;background:radial-gradient(circle,rgba(59,130,246,.14),transparent 68%);pointer-events:none}.insights-head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}.insights-title h2{font-size:18px;margin:0}.insights-title p{color:var(--muted);margin:3px 0 0}.periods{display:flex;gap:6px;padding:4px;background:#edf3fb;border-radius:11px}.period{height:32px;border:0;border-radius:8px;padding:0 13px;color:var(--muted);background:transparent;cursor:pointer}.period.active{background:#fff;color:var(--primary);box-shadow:0 3px 10px rgba(30,64,175,.12);font-weight:650}.insight-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric{border:1px solid rgba(226,232,240,.85);background:rgba(255,255,255,.82);border-radius:11px;padding:12px 14px}.metric strong{display:block;font-size:20px;line-height:1.2}.metric span{color:var(--muted);font-size:12px}.insight-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(250px,1fr);gap:14px}.cloud-panel,.rank-panel{border:1px solid rgba(226,232,240,.9);background:rgba(255,255,255,.84);border-radius:12px;padding:16px}.panel-caption{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.panel-caption span{font-size:12px;color:var(--muted)}.word-cloud{min-height:260px;display:flex;align-content:center;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 13px;padding:18px}.cloud-word{display:inline-block;line-height:1.05;padding:4px;font-weight:700;text-shadow:0 1px 0 #fff}.cat-research{color:#3157c8}.cat-literature{color:#7c3aed}.cat-experiment{color:#c2410c}.cat-model{color:#0369a1}.cat-data{color:#047857}.cat-analysis{color:#0f766e}.cat-writing{color:#be185d}.cat-code{color:#4f46e5}.cat-engineering{color:#475569}.rank-list{display:grid;gap:9px;max-height:278px;overflow:auto;padding-right:3px}.rank-row{padding:0;text-align:left}.rank-line{display:flex;justify-content:space-between;gap:10px;font-size:13px}.rank-line span:last-child{color:var(--muted)}.rank-track{height:5px;border-radius:99px;background:#edf2f7;margin-top:5px;overflow:hidden}.rank-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#60a5fa,#6366f1)}.cloud-empty{width:100%;text-align:center;color:var(--muted);padding:72px 12px}.cloud-status{font-size:12px;color:var(--muted)}
    [hidden]{display:none!important}@media(max-width:900px){.shell{padding:14px}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}.insights-head{align-items:flex-start;flex-direction:column}.insight-metrics{grid-template-columns:repeat(2,1fr)}.insight-grid{grid-template-columns:1fr}.word-cloud{min-height:220px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="header"><div><h1>对话与 Agent 轨迹归档</h1><p>仅显示脱敏后的归档数据；当前 30 天自动删除任务已关闭。</p></div><div class="session" id="session">检查登录状态…</div></header>
    <nav class="tabs"><button class="tab active" data-view="conversations">最终对话</button><button class="tab" data-view="trajectories">Agent 轨迹</button></nav>
    <section class="card insights conversation-only" id="keyword_insights">
      <div class="insights-head"><div class="insights-title"><h2>科研问题热点</h2><p>每天凌晨 03:00 生成静态快照；页面只读取聚合结果</p></div><div class="periods"><button class="period" type="button" data-days="7">近 7 天</button><button class="period active" type="button" data-days="30">近 30 天</button><button class="period" type="button" id="cloud_refresh" title="重新读取快照">重新读取</button></div></div>
      <div class="insight-metrics"><div class="metric"><strong id="metric_processed">-</strong><span>已分析问题</span></div><div class="metric"><strong id="metric_eligible">-</strong><span>有效科研问题</span></div><div class="metric"><strong id="metric_users">-</strong><span>覆盖用户</span></div><div class="metric"><strong id="metric_topics">-</strong><span>热点主题</span></div></div>
      <div class="insight-grid"><div class="cloud-panel"><div class="panel-caption"><strong>关键词云</strong><span class="cloud-status" id="cloud_status">准备加载…</span></div><div class="word-cloud" id="word_cloud"></div></div><aside class="rank-panel"><div class="panel-caption"><strong>热门问题 Top 10</strong><span>按用户与对话热度</span></div><div class="rank-list" id="keyword_rank"></div></aside></div>
    </section>
    <form class="card filters" id="filters">
      <div class="field"><label for="user_id">用户编号</label><input id="user_id" name="user_id" inputmode="numeric"></div>
      <div class="field conversation-only"><label for="api_key_id">API Key 编号</label><input id="api_key_id" name="api_key_id" inputmode="numeric"></div>
      <div class="field"><label for="model">模型</label><input id="model" name="model"></div>
      <div class="field conversation-only"><label for="protocol">协议</label><input id="protocol" name="protocol" placeholder="openai_chat"></div>
      <div class="field trajectory-only" hidden><label for="trajectory_status">状态</label><select id="trajectory_status"><option value="">全部</option><option value="completed">completed</option><option value="failed">failed</option><option value="aborted">aborted</option><option value="incomplete">incomplete</option></select></div>
      <div class="field trajectory-only" hidden><label for="source">来源</label><input id="source" value="codex_local"></div>
      <div class="field trajectory-only" hidden><label for="tool_name">工具名</label><input id="tool_name"></div>
      <div class="field"><label for="start_time">开始时间</label><input id="start_time" type="datetime-local"></div>
      <div class="field"><label for="end_time">结束时间</label><input id="end_time" type="datetime-local"></div>
      <div class="actions"><button class="btn primary" type="submit">查询</button><button class="btn" type="button" id="reset">重置</button></div>
    </form>
    <section class="card">
      <div class="table-head"><strong id="table_title">最终对话记录</strong><span class="status" id="status"></span></div>
      <div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>没有符合条件的记录</div></div>
      <div class="pagination"><span id="page_info">第 1 / 1 页</span><button class="btn" id="prev" type="button">上一页</button><button class="btn" id="next" type="button">下一页</button></div>
    </section>
  </main>
  <div class="overlay" id="overlay" role="dialog" aria-modal="true"><aside class="drawer"><div class="drawer-head"><strong id="detail_title">详情</strong><button class="close" id="close" aria-label="关闭">×</button></div><div class="drawer-body" id="detail_body"></div></aside></div>
  <script>
    const API='/_archive/api/v1';let view='conversations',page=1,pages=1,loading=false,keywordDays=30,keywordLoading=false;
    const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const token=()=>localStorage.getItem('auth_token')||'';const fmtTime=v=>v?new Date(v).toLocaleString():'-';const fmtJSON=v=>{try{return JSON.stringify(v,null,2)}catch{return String(v??'')}};
    function goLogin(){location.href='/login?redirect='+encodeURIComponent('/_archive/admin/')}
    async function refreshToken(){const refresh=localStorage.getItem('refresh_token');if(!refresh)return false;try{const r=await fetch('/api/v1/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});const j=await r.json();const d=j&&j.code===0?j.data:j;if(!r.ok||!d?.access_token)return false;localStorage.setItem('auth_token',d.access_token);if(d.refresh_token)localStorage.setItem('refresh_token',d.refresh_token);return true}catch{return false}}
    async function request(path,retry=true){if(!token()){goLogin();throw new Error('未登录')}let r=await fetch(API+path,{headers:{Authorization:'Bearer '+token(),Accept:'application/json'}});if(r.status===401&&retry&&await refreshToken())return request(path,false);let j={};try{j=await r.json()}catch{}if(r.status===401){goLogin();throw new Error('登录已过期')}if(r.status===403){throw new Error('需要管理员权限')}if(!r.ok||j.code!==0)throw new Error(j.message||('请求失败 '+r.status));return j.data}
    function query(){const q=new URLSearchParams({page:String(page),page_size:'50'});for(const name of ['user_id','model']){const v=$(name).value.trim();if(v)q.set(name,v)}for(const name of ['start_time','end_time']){const v=$(name).value;if(v)q.set(name,new Date(v).toISOString())}if(view==='conversations'){for(const name of ['api_key_id','protocol']){const v=$(name).value.trim();if(v)q.set(name,v)}}else{const mapping={trajectory_status:'status',source:'source',tool_name:'tool_name'};for(const [id,name] of Object.entries(mapping)){const v=$(id).value.trim();if(v)q.set(name,v)}}return q.toString()}
    const compactNumber=value=>new Intl.NumberFormat('zh-CN',{notation:Number(value)>=10000?'compact':'standard',maximumFractionDigits:1}).format(Number(value)||0);
    async function loadKeywordCloud(){if(keywordLoading)return;keywordLoading=true;$('cloud_status').textContent='正在读取快照…';try{const d=await request(`/conversation-keywords?days=${keywordDays}&limit=60`),items=d.items||[];$('metric_processed').textContent=compactNumber(d.processed_documents);$('metric_eligible').textContent=compactNumber(d.eligible_documents);$('metric_users').textContent=compactNumber(d.covered_users);$('metric_topics').textContent=compactNumber(items.length);if(!items.length){$('word_cloud').innerHTML='<div class="cloud-empty">静态快照尚未生成，请稍后重新读取</div>';$('keyword_rank').innerHTML='<div class="cloud-empty">暂无热点</div>'}else{const weights=items.map(x=>Number(x.weight)||0),min=Math.min(...weights),max=Math.max(...weights),range=Math.max(1,max-min);$('word_cloud').innerHTML=items.map(x=>{const size=15+((Number(x.weight)-min)/range)*20;return `<span class="cloud-word cat-${esc(x.category)}" style="font-size:${size.toFixed(1)}px" title="${x.conversations} 次对话 · ${x.users} 名用户">${esc(x.keyword)}</span>`}).join('');const top=items.slice(0,10),topValue=Math.max(1,...top.map(x=>Number(x.weight)||0));$('keyword_rank').innerHTML=top.map((x,index)=>`<div class="rank-row"><span class="rank-line"><span>${index+1}. ${esc(x.keyword)}</span><span>${x.conversations} 次</span></span><span class="rank-track"><span class="rank-fill" style="display:block;width:${Math.max(8,(Number(x.weight)||0)/topValue*100).toFixed(1)}%"></span></span></div>`).join('')}$('cloud_status').textContent=d.generated_at?`快照时间 ${new Date(d.generated_at).toLocaleString()}`:'快照尚未生成'}catch(e){$('cloud_status').textContent=e.message;$('word_cloud').innerHTML='<div class="cloud-empty">热点快照暂不可用，不影响归档查询</div>';$('keyword_rank').innerHTML=''}finally{keywordLoading=false}}
    function headers(){if(view==='conversations')return '<tr><th>ID</th><th>用户</th><th>API Key</th><th>模型</th><th>协议</th><th>完成时间</th><th>耗时</th><th>HTTP</th><th>隐私命中</th><th>请求编号</th></tr>';return '<tr><th>ID</th><th>用户</th><th>状态</th><th>模型</th><th>来源</th><th>完成时间</th><th>事件</th><th>工具调用</th><th>隐私命中</th><th>Turn ID</th></tr>'}
    function rows(items){if(view==='conversations')return items.map(x=>`<tr data-id="${x.id}"><td>${x.id}</td><td>${x.user_id}</td><td>${x.api_key_id??'-'}</td><td>${esc(x.model||'-')}</td><td>${esc(x.protocol)}</td><td>${esc(fmtTime(x.completed_at))}</td><td>${x.duration_ms} ms</td><td>${x.response_status}</td><td>${x.privacy_entities}</td><td class="mono">${esc(x.client_request_id||x.request_id)}</td></tr>`).join('');return items.map(x=>`<tr data-id="${x.id}"><td>${x.id}</td><td>${x.user_id}</td><td><span class="pill ${esc(x.status)}">${esc(x.status)}</span></td><td>${esc(x.model||'-')}</td><td>${esc(x.source)}</td><td>${esc(fmtTime(x.completed_at))}</td><td>${x.event_count}</td><td>${x.tool_call_count}</td><td>${x.privacy_entities}</td><td class="mono">${esc(x.source_turn_id)}</td></tr>`).join('')}
    async function load(){if(loading)return;loading=true;$('status').className='status';$('status').textContent='加载中…';try{const path=view==='conversations'?'/conversation-archives':'/agent-trajectories';const d=await request(path+'?'+query());pages=d.pages||1;page=d.page||1;$('head').innerHTML=headers();$('rows').innerHTML=rows(d.items||[]);$('empty').hidden=(d.items||[]).length>0;$('page_info').textContent=`第 ${page} / ${pages} 页，共 ${d.total||0} 条`;$('prev').disabled=page<=1;$('next').disabled=page>=pages;$('status').textContent='';document.querySelectorAll('#rows tr').forEach(tr=>tr.onclick=()=>detail(tr.dataset.id))}catch(e){$('status').className='status error';$('status').textContent=e.message}finally{loading=false}}
    async function detail(id){$('overlay').classList.add('open');$('detail_title').textContent=(view==='conversations'?'最终对话 #':'Agent 轨迹 #')+id;$('detail_body').innerHTML='<div class="status">加载中…</div>';try{if(view==='conversations'){const x=await request('/conversation-archives/'+id);$('detail_body').innerHTML=`<div class="grid"><div class="kv"><span>用户编号</span>${x.user_id}</div><div class="kv"><span>API Key</span>${x.api_key_id??'-'}</div><div class="kv"><span>完成时间</span>${esc(fmtTime(x.completed_at))}</div><div class="kv"><span>模型</span>${esc(x.model||'-')}</div><div class="kv"><span>协议</span>${esc(x.protocol)}</div><div class="kv"><span>耗时 / HTTP</span>${x.duration_ms} ms / ${x.response_status}</div></div>${section('请求编号',x.client_request_id||x.request_id)}${section('精简后的归档请求',fmtJSON(x.request_payload))}${section('最终可见助手回复',x.assistant_text||'')}${section('最终工具调用',fmtJSON(x.tool_calls))}${section('归并后的最终结果',fmtJSON(x.final_response))}`;return}const x=await request('/agent-trajectories/'+id);const ev=await request('/agent-trajectories/'+id+'/events?page=1&page_size=500');$('detail_body').innerHTML=`<div class="grid"><div class="kv"><span>用户编号</span>${x.user_id}</div><div class="kv"><span>状态</span><span class="pill ${esc(x.status)}">${esc(x.status)}</span></div><div class="kv"><span>完成时间</span>${esc(fmtTime(x.completed_at))}</div><div class="kv"><span>模型</span>${esc(x.model||'-')}</div><div class="kv"><span>事件 / 工具调用</span>${x.event_count} / ${x.tool_call_count}</div><div class="kv"><span>隐私命中</span>${x.privacy_entities}</div></div>${section('Trajectory ID',x.trajectory_id)}${section('最终回答',x.final_text||'')}<div class="section"><h3>事件时间线（显示 ${ev.items.length} / ${ev.total}）</h3><div class="timeline">${ev.items.map(eventHTML).join('')}</div></div>`}catch(e){$('detail_body').innerHTML='<div class="status error">'+esc(e.message)+'</div>'}}
    const section=(title,body)=>`<div class="section"><h3>${esc(title)}</h3><pre class="pre">${esc(body)}</pre></div>`;
    function eventHTML(e){const phase=e.phase?' · '+e.phase:'';const tool=e.tool_name?' · '+e.tool_name:'';const truncated=e.is_truncated?'<span class="pill incomplete">已截断</span>':'';return `<article class="event ${esc(e.event_type)}"><div class="event-head"><span class="event-title">#${e.sequence_no} ${esc(e.event_type)}</span><span class="pill">${esc(e.role||'-')}${esc(phase)}</span>${truncated}</div><div class="event-meta">${esc(fmtTime(e.event_at))}${esc(tool)} · ${e.stored_bytes}/${e.original_bytes} bytes</div><details><summary>查看脱敏内容</summary><pre class="pre">${esc(fmtJSON(e.content))}</pre></details></article>`}
    document.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{view=tab.dataset.view;page=1;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===tab));document.querySelectorAll('.conversation-only').forEach(x=>x.hidden=view!=='conversations');document.querySelectorAll('.trajectory-only').forEach(x=>x.hidden=view!=='trajectories');$('table_title').textContent=view==='conversations'?'最终对话记录':'Agent 训练轨迹';load();if(view==='conversations')loadKeywordCloud()});
    $('filters').onsubmit=e=>{e.preventDefault();page=1;load()};$('reset').onclick=()=>{$('filters').reset();if(view==='trajectories')$('source').value='codex_local';page=1;load()};$('prev').onclick=()=>{if(page>1){page--;load()}};$('next').onclick=()=>{if(page<pages){page++;load()}};$('close').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};
    document.querySelectorAll('.period[data-days]').forEach(button=>button.onclick=()=>{keywordDays=Number(button.dataset.days);document.querySelectorAll('.period[data-days]').forEach(x=>x.classList.toggle('active',x===button));loadKeywordCloud()});$('cloud_refresh').onclick=()=>loadKeywordCloud();
    (async()=>{try{const me=await request('/session');$('session').textContent=(me.username||me.email||'管理员')+' · 管理员';await Promise.all([load(),loadKeywordCloud()])}catch(e){$('session').textContent=e.message}})();
    /* The request payload is protocol-shaped JSON. Render its logical messages
       separately so the user's question is visible without searching raw JSON. */
    function parseJSONValue(value){if(typeof value!=='string')return value;try{return JSON.parse(value)}catch{return value}}
    function visibleText(value){
      if(value==null)return '';
      if(typeof value==='string')return value;
      if(Array.isArray(value))return value.map(visibleText).filter(Boolean).join('\n');
      if(typeof value==='object'){
        if(typeof value.text==='string')return value.text;
        if(typeof value.value==='string'&&['text','input_text','output_text'].includes(String(value.type||'').toLowerCase()))return value.value;
        if(Array.isArray(value.parts))return value.parts.map(visibleText).filter(Boolean).join('\n');
        if(value.content!==undefined)return visibleText(value.content);
      }
      return '';
    }
    function requestMessages(payload){
      const p=parseJSONValue(payload);if(!p||typeof p!=='object')return [];
      let items=[];
      if(Array.isArray(p.messages))items=p.messages;
      else if(Array.isArray(p.input))items=p.input;
      else if(Array.isArray(p.contents))items=p.contents;
      else if(typeof p.input==='string')items=[{role:'user',content:p.input}];
      const result=items.map((item,index)=>{
        const role=String(item?.role||'').toLowerCase()==='model'?'assistant':String(item?.role||'').toLowerCase();
        return {role:role||'unknown',text:visibleText(item?.content!==undefined?item.content:(item?.parts!==undefined?item.parts:item)),raw:item,index};
      }).filter(item=>item.text||item.raw);
      if(typeof p.instructions==='string'&&p.instructions.trim())result.unshift({role:'developer',text:p.instructions,raw:{instructions:p.instructions},index:-1});
      return result;
    }
    function structuredMessages(title,items){
      const body=items.length?`<div class="message-list">${items.map(item=>`<article class="message-card ${esc(item.role)}"><div class="message-role">${esc(item.role)} #${item.index+1}</div><pre class="pre">${esc(item.text||fmtJSON(item.raw))}</pre>${item.raw?.tool_calls?`<details><summary>工具调用参数</summary><pre class="pre">${esc(fmtJSON(item.raw.tool_calls))}</pre></details>`:''}</article>`).join('')}</div>`:'<div class="pre">-</div>';
      return `<div class="section"><h3>${esc(title)}（${items.length}）</h3>${body}</div>`;
    }
    function collapsedJSON(title,value){return `<div class="section"><details><summary>${esc(title)}</summary><pre class="pre">${esc(fmtJSON(value))}</pre></details></div>`}
    async function detail(id){
      $('overlay').classList.add('open');$('detail_title').textContent=(view==='conversations'?'最终对话 #':'Agent 轨迹 #')+id;$('detail_body').innerHTML='<div class="status">加载中…</div>';
      try{
        if(view==='conversations'){
          const x=await request('/conversation-archives/'+id),messages=requestMessages(x.request_payload);
          const users=messages.filter(item=>item.role==='user');
          $('detail_body').innerHTML=`<div class="grid"><div class="kv"><span>用户编号</span>${x.user_id}</div><div class="kv"><span>API Key</span>${x.api_key_id??'-'}</div><div class="kv"><span>完成时间</span>${esc(fmtTime(x.completed_at))}</div><div class="kv"><span>模型</span>${esc(x.model||'-')}</div><div class="kv"><span>协议</span>${esc(x.protocol)}</div><div class="kv"><span>耗时 / HTTP</span>${x.duration_ms} ms / ${x.response_status}</div></div>${section('请求编号',x.client_request_id||x.request_id)}${structuredMessages('用户最后一条消息',users)}${section('最终可见助手回复',x.assistant_text||'')}${section('最终工具调用',fmtJSON(x.tool_calls))}${section('归并后的最终结果',fmtJSON(x.final_response))}${collapsedJSON('精简后的归档请求',x.request_payload)}`;
          return;
        }
        const x=await request('/agent-trajectories/'+id),ev=await request('/agent-trajectories/'+id+'/events?page=1&page_size=500');$('detail_body').innerHTML=`<div class="grid"><div class="kv"><span>用户编号</span>${x.user_id}</div><div class="kv"><span>状态</span><span class="pill ${esc(x.status)}">${esc(x.status)}</span></div><div class="kv"><span>完成时间</span>${esc(fmtTime(x.completed_at))}</div><div class="kv"><span>模型</span>${esc(x.model||'-')}</div><div class="kv"><span>事件 / 工具调用</span>${x.event_count} / ${x.tool_call_count}</div><div class="kv"><span>隐私命中</span>${x.privacy_entities}</div></div>${section('Trajectory ID',x.trajectory_id)}${section('最终回答',x.final_text||'')}<div class="section"><h3>事件时间线（显示 ${ev.items.length} / ${ev.total}）</h3><div class="timeline">${ev.items.map(eventHTML).join('')}</div></div>`;
      }catch(e){$('detail_body').innerHTML='<div class="status error">'+esc(e.message)+'</div>'}
    }
  </script>
