# Additional service tokens with stable prefixes or strong surrounding context.
- id: digitalocean-token
  title: DigitalOcean Personal Access Token
  type: digitalocean_token
  vendor: digitalocean
  version: 1
  license: MIT
  confidence: 85
  patterns:
    - '(?<![A-Za-z0-9])(dop_v1_[A-Za-z0-9_-]{32,128})(?![A-Za-z0-9_-])'
  secret_group: 1
  min_length: 39
  tests:
    positives:
      - !synthetic "DIGITALOCEAN_TOKEN=dop_v1_{test:alnum:46:4ba3b3de8ff7}"
    negatives:
      - 'DIGITALOCEAN_TOKEN=dop_v1_short'

- id: vault-service-token
  title: HashiCorp Vault Service Token
  type: vault_service_token
  vendor: hashicorp
  version: 1
  license: MIT
  confidence: 85
  patterns:
    - '(?<![A-Za-z0-9])(hvs\.[A-Za-z0-9_-]{20,})(?![A-Za-z0-9_-])'
    - '(?<![A-Za-z0-9])(s\.[A-Za-z0-9_-]{20,})(?![A-Za-z0-9_-])'
  min_length: 22
  tests:
    positives:
      - !synthetic "VAULT_TOKEN=hvs.{test:alnum:32:124b253a5c06}"
    negatives:
      - 'VAULT_TOKEN=hvs.short'

