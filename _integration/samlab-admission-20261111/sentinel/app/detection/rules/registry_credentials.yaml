# Package registry credential assignments.
# These rules require an explicit provider-specific configuration key so
# ordinary package metadata and arbitrary high-entropy strings are ignored.
- id: nuget-api-key-assignment
  title: NuGet API key assignment
  type: nuget_api_key
  vendor: nuget
  version: 1
  license: MIT
  confidence: 80
  patterns:
    - '(?im)^[ \t]*(?:NUGET_API_KEY|NUGET_APIKEY|NuGetApiKey|X-NuGet-ApiKey)[ \t]*(?:[:=])[ \t]*["'']?(?P<secret>[A-Za-z0-9+/=_-]{20,128})["'']?[ \t]*$'
    - '(?im)^[ \t]*["''](?:NUGET_API_KEY|NUGET_APIKEY|NuGetApiKey|X-NuGet-ApiKey)["''][ \t]*:[ \t]*["''](?P<secret>[A-Za-z0-9+/=_-]{20,128})["''][ \t]*,?[ \t]*$'
  min_length: 20
  max_length: 128
  min_entropy: 2.8
  forbidden_secret_values:
    - '(?i)^(?:password|token|example|changeme|your[_-]?.*|user[_-]?.*|api[_-]?key|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
  tests:
    positives:
      - !synthetic "NUGET_API_KEY={test:alnum:32:4f1bce03b82f}"
      - !synthetic "X-NuGet-ApiKey: {test:alnum:32:4f1bce03b82f}"
      - !synthetic "\"NuGetApiKey\": \"{test:alnum:32:4f1bce03b82f}\","
    negatives:
      - 'NUGET_API_KEY=your_api_key_here'
      - !synthetic "apiKey: {test:hex:32:b99db9f8ceb7}"
      - 'NUGET_API_KEY=short'

- id: cargo-registry-token-assignment
  title: Cargo registry token assignment
  type: cargo_registry_token
  vendor: crates.io
  version: 1
  license: MIT
  confidence: 80
  patterns:
    - '(?im)^[ \t]*(?:CARGO_REGISTRY_TOKEN|CARGO_REGISTRIES_[A-Z0-9_]+_TOKEN)[ \t]*(?:[:=])[ \t]*["'']?(?P<secret>[A-Za-z0-9._~+/=-]{20,160})["'']?[ \t]*$'
    - '(?im)^[ \t]*token[ \t]*=[ \t]*["''](?P<secret>[A-Za-z0-9._~+/=-]{20,160})["''][ \t]*$'
  min_length: 20
  max_length: 160
  min_entropy: 2.8
  context_window: 4
  required_context:
    - '(?i)(?:cargo|crates[.]io|\[registry\]|\[registries[.])'
  forbidden_secret_values:
    - '(?i)^(?:password|token|example|changeme|your[_-]?.*|user[_-]?.*|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
  tests:
    positives:
      - !synthetic "CARGO_REGISTRY_TOKEN=cio1_{test:alnum:32:4f1bce03b82f}"
      - !synthetic "[registry]\ntoken = \"cio1_{test:alnum:32:4f1bce03b82f}\"\n"
      - !synthetic "[registries.private]\ntoken = \"registry_{test:alnum:32:4f1bce03b82f}\"\n"
    negatives:
      - 'CARGO_REGISTRY_TOKEN=your_token_here'
      - |
        [package]
        token = "ordinary-package-metadata-value"
      - 'CARGO_REGISTRY_TOKEN=short'

- id: huggingface-token-variant
  title: Hugging Face token variant
  type: huggingface_token
  vendor: huggingface
  version: 1
  license: MIT
  confidence: 82
  patterns:
    - '(?<![A-Za-z0-9_])hf_[A-Za-z0-9]{30,80}(?![A-Za-z0-9_])'
  min_length: 33
  max_length: 83
  min_entropy: 2.8
  forbidden_secret_values:
    - '(?i)^hf_(?:x+|example|placeholder|token)$'
  tests:
    positives:
      - !synthetic "HF_TOKEN=hf_{test:alnum:35:7040efb9fd1d}"
    negatives:
      - 'HF_TOKEN=hf_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'
      - 'hf_short'
