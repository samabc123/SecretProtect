# Additional common SaaS, platform and AI service credential formats.
- id: heroku-api-key
  title: Heroku API Key
  type: heroku_api_key
  vendor: heroku
  version: 1
  license: MIT
  confidence: 80
  patterns:
    - '(?<![A-Za-z0-9])(heroku_[A-Za-z0-9]{24,})(?![A-Za-z0-9])'
  secret_group: 1
  min_length: 31
  tests:
    positives:
      - !synthetic "HEROKU_API_KEY=heroku_{test:alnum:28:531cad85a0fa}"
    negatives:
      - 'HEROKU_API_KEY=heroku_short'

- id: mailchimp-api-key
  title: Mailchimp API Key
  type: mailchimp_api_key
  vendor: mailchimp
  version: 1
  license: MIT
  confidence: 80
  patterns:
    - '(?<![A-Za-z0-9])([a-f0-9]{32}-us[0-9]{1,3})(?![A-Za-z0-9])'
  secret_group: 1
  min_length: 36
  required_context:
    - '(?i)(mailchimp|mandrill|marketing)'
  tests:
    positives:
      - !synthetic "MAILCHIMP_API_KEY={test:hex:32:f1bcb49aab34}-us21"
    negatives:
      - !synthetic "MAILCHIMP_API_KEY={test:hex:16:582bbc6886b8}-us21"

