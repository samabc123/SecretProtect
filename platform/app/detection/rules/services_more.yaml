- id: supabase-service-role-key
  title: Supabase Service Role JWT
  type: supabase_service_role_key
  vendor: supabase
  version: 1
  license: MIT
  confidence: 85
  patterns:
    - '(?i)supabase[^=\n]{0,40}=\s*(?P<secret>eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})'
  min_length: 40
  tests:
    positives:
      - !synthetic "SUPABASE_SERVICE_ROLE_KEY=eyJ{test:alnum:17:73bc28b6250f}.{test:alnum:16:2fa8b4d7e67c}.{test:alnum:18:00d201a878d8}"
    negatives:
      - 'SUPABASE_SERVICE_ROLE_KEY=eyJ.short'

